name: Feature request
description: A new ecosystem, lockfile, signal or output format
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first, then the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example input or output
      description: e.g. a sanitized lockfile excerpt, or the JSON you'd like to see.
