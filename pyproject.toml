[project]
name = "prismsca"
version = "0.1.0"
description = "Local-first SCA: third-party library inventory, OSV patches, behavioral risk signals, and PrismRedline handoff"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Michael Aaron Waxman"}
]
dependencies = [
    "packaging>=23.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
prismsca = "prismsca.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
